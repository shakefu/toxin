# yaml-language-server: $schema=https://shakefu.github.io/yass/v1.schema.json
---
description: >
  toxin is a Go port of pyconfig (Python) and jetconfig (Node.js):
  configuration addressed by dot-notation keys under a namespace prefix,
  case-insensitive by default, with optional etcd v3 storage, in-process
  values, JSON-typed values, configuration inheritance, watching, and a
  command line tool. The library API owns 20-api, the etcd v3 wire behavior
  owns 10-etcd3, and the command line tool owns 30-cli.
version: v1
---
design: EnvNaming
type: constraint
content: |
  toxin's own runtime configuration — the variables below — comes from
  the process environment, named with a TOXIN_ prefix. Each variable,
  its meaning, and its default:

    TOXIN_ETCD           Comma-separated etcd member list; each entry is
                         host[:port], optionally prefixed scheme:// and
                         user:password@. Overrides programmatic hosts.
                         No library client by default; CLI etcd operations
                         default to 127.0.0.1:2379. Blank entries are
                         dropped, and a non-empty value with no remaining
                         entries disables the library client and is an
                         error for CLI etcd operations.
                         (from PYCONFIG_ETCD_HOSTS, JETCONFIG_ETCD)
    TOXIN_PREFIX         Namespace prefix for keys; default "config/".
                         (from PYCONFIG_ETCD_PREFIX)
    TOXIN_SSL_CA         Comma-separated CA certificate file paths; each
                         file may hold concatenated PEM certificates.
                         Used only with an effective etcd member list.
                         (from JETCONFIG_SSL_CA, PYCONFIG_ETCD_CACERT)
    TOXIN_SSL_CERT       Client certificate file path.
                         Used only with an effective etcd member list.
                         (from JETCONFIG_SSL_CERT, PYCONFIG_ETCD_CERT)
    TOXIN_SSL_KEY        Client key file path.
                         Used only with an effective etcd member list.
                         (from JETCONFIG_SSL_KEY, PYCONFIG_ETCD_KEY)
    TOXIN_AUTH           Basic auth credentials "username:password".
                         Used only with an effective etcd member list.
                         (from PYCONFIG_ETCD_AUTH)
    TOXIN_LOGLEVEL       One of silly, debug, info, warn, critical;
                         default critical. Governs every log message
                         toxin emits, including the diagnostics the etcd
                         client itself logs: toxin never lets the client
                         build its own stderr logger or derive one from
                         ETCD_CLIENT_DEBUG. grpc's process-wide logger,
                         which clientv3 installs when ETCD_CLIENT_DEBUG is
                         set at process start and which GRPC_GO_LOG_*
                         tune, belongs to grpc and is outside toxin's
                         control. (from JETCONFIG_LOGLEVEL)
    TOXIN_CACHE          Directory for the file cache.
                         (from JETCONFIG_CACHE)
    TOXIN_CONFIG         Comma-separated JSON config file paths; entries
                         are trimmed and blank entries dropped. The files
                         are read after, and so override, the config
                         files given programmatically. No config files by
                         default. (new in toxin)
    TOXIN_WATCH          Any non-empty value enables watching.
                         (from PYCONFIG_ETCD_WATCH)
    TOXIN_INHERIT_DEPTH  Maximum inheritance depth; default 2.
                         (from PYCONFIG_INHERIT_DEPTH)

  An environment variable set to the empty string reads as unset, except
  TOXIN_WATCH, where any non-empty value is truthy.

  Reading these variables is on by default and can be turned off per
  instance: a Config constructed with WithEnv(false) reads none of them and
  takes its runtime configuration from its options and defaults alone.

  WithEnv(false) turns off TOXIN_CONFIG like every other variable here;
  config files given programmatically still apply.

  Per-setting environment overrides are not runtime configuration and
  carry no TOXIN_ prefix: toxin.Env checks the setting name uppercased
  with dots replaced by underscores.
---
design: Sources
type: procedure
content: |
  A setting's value resolves from these sources, lowest precedence first;
  each later source wins over the earlier ones per key, and the caller's
  default answers only when no source defines the key:

  1. The inherited chain, parent first.
  2. The configuration's own etcd namespace, or the file cache standing in
     for it.
  3. JSON config files, in their effective order: those given
     programmatically, then those named by TOXIN_CONFIG; a later file wins
     over an earlier one per key.
  4. Explicit in-process writes made after the last load: Set, and Load
     with a supplied config.

  Config files are read and parsed at construction and again on every
  load without a supplied config; their keys are served from the settings
  cache with no load and, without etcd, no network I/O. Each file holds
  one JSON object, flattened into dot-notation keys like a supplied
  config. All files are read before the cache is touched, so a file that
  cannot be read fails the load and leaves the live settings intact.
  Config files are read-only to toxin: they are never written, and their
  values reach etcd only through a load that explicitly writes through.
  An etcd watch event does not displace a config-file value, and a watched
  directory delete keeps them. Clear is an explicit in-process action that
  outranks the files: it empties their values too, and etcd events apply
  to those keys again until the next load re-reads the files.
  Because they are served through the settings cache, a configuration
  with caching disabled, or a read that bypasses the cache, does not
  consult them; with etcd, such a bypassing read that caches its result
  replaces the config-file value until the next load.
---
spec: toxin
INPUT:
  - MUST: 'accept configuration access from Go programs through the public library API'
    SEE: 20-api@toxin.New
  - MUST: 'offer a process-wide shared configuration behind package-level functions'
    SEE: 20-api@toxin.Default
  - MUST: 'resolve a setting from an environment variable before the configuration before a default'
    SEE: 20-api@toxin.Env
  - MUST: 'let a library caller opt one configuration instance out of every `TOXIN_*` runtime variable, so it takes its runtime configuration from options and defaults alone'
    SEE: 20-api@toxin.New
    USES: EnvNaming
  - MUST: 'accept shell invocation of the toxin binary, which dispatches between a source-scanning mode and etcd management subcommands'
    SEE: 30-cli@cli.Main
  - MUST: 'address settings by dot-notation keys resolved under a namespace prefix'
    USES: 10-etcd3@EtcdKeys
  - MUST: 'accept JSON config files, given programmatically or by `TOXIN_CONFIG`, as a configuration source that works with or without etcd'
    SEE: 20-api@toxin.New
    USES: Sources
RETURN:
  - WHEN: 'etcd is configured'
    MUST: 'yield values decoded from JSON storage, falling back to the raw stored string when it is not valid JSON'
    USES: 10-etcd3@ValueEncoding
  - WHEN: 'etcd is not configured'
    MUST: 'preserve the original typed values of in-process settings'
  - MUST: 'return a caller-supplied default when a key is unset'
ERROR:
  - WHEN: 'etcd is configured and an etcd operation fails'
    MUST: 'surface the failure to library callers as an error, and to command line users as a message on stderr with exit status one'
SIDE-EFFECT:
  - WHEN: 'etcd is configured'
    MUST: 'store and read configuration in an etcd v3 cluster, version 3.3 or newer, over gRPC'
  - WHEN: 'etcd is not configured'
    MUST: 'resolve configuration from in-process values, supplied maps, the file cache, config files, and caller-supplied defaults'
    USES: Sources
  - WHEN: 'etcd is not configured'
    MUST-NOT: 'create an etcd client or dial a cluster'
  - WHEN: 'etcd is not configured'
    MUST-NOT: 'start a watcher or emit a log message'
  - MUST-NOT: 'read or write any etcd key outside the configured namespace prefix'
  - MUST-NOT: 'write to a config file'
    USES: Sources
INVARIANT:
  - USES: EnvNaming
  - USES: 10-etcd3@ValueEncoding
  - USES: 10-etcd3@EtcdKeys
  - USES: 20-api@Inheritance
  - USES: Sources
  - WHEN: 'case sensitivity is not enabled at construction'
    MUST: 'treat keys as case-insensitive, lowercasing them for storage and lookup'
  - WHEN: 'case sensitivity is enabled at construction'
    MUST: 'preserve key case through storage and lookup'
  - MUST-NOT: 'execute code found in any configuration source, because configuration is data'
