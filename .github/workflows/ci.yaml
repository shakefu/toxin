# CI for toxin. release.yaml calls this workflow through workflow_call
# before it releases; the job names Lint and Test are the required status
# checks. Every job installs the mise toolchain bundle (mise.toml +
# mise.lock, cached by the mise action) — the same versions bootstrap
# installs locally, govulncheck included (golang/vuln ships no binaries;
# mise builds it once and it caches with the rest). The Test job runs
# script/cibuild, which runs script/test: the yass spec gates, the Go
# test suite (which needs Docker — the tests launch real etcd containers
# through testcontainers-go), and gofmt/go vet.
name: CI

on:
    workflow_call:
    pull_request:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event.number || 'main' }}
    cancel-in-progress: true

jobs:
    validate:
        name: Validate
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            # The upstreams in .common-repo.yaml are public, so the CLI
            # clones them anonymously — no token needed. The version is
            # the mise.toml pin, not setup-common-repo's input.
            - name: Tools (mise)
              uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
            - name: Validate configuration
              run: common-repo validate
            # Exits 1 when a managed file differs from the result of
            # `common-repo apply`.
            - name: Check managed files
              run: common-repo diff

    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Tools (mise)
              uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
            # prek is already on PATH from the mise bundle; the action
            # detects it and only fetches the pre-commit environments.
            - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Tools (mise)
              uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
            - name: Run tests
              run: ./script/cibuild
