# CI for toxin. release.yaml calls this workflow through workflow_call
# before it releases; the job names Lint and Test are the required status
# checks. The Test job runs script/cibuild, which runs script/test: the
# yass spec gates, the Go test suite (which needs Docker — the tests launch
# real etcd containers through testcontainers-go), and gofmt/go vet.
name: CI

on:
    workflow_call:
    pull_request:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event.number || 'main' }}
    cancel-in-progress: true

jobs:
    validate:
        name: Validate
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            # The upstreams in .common-repo.yaml are public, so the CLI
            # clones them anonymously — no token needed.
            - uses: common-repo/setup-common-repo@887d2b31e6678fb650d1b1b6fb6097afa5528310 # v1
              with:
                  version: v0.38.4
            - name: Validate configuration
              run: common-repo validate
            # Exits 1 when a managed file differs from the result of
            # `common-repo apply`.
            - name: Check managed files
              run: common-repo diff

    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
              with:
                  go-version-file: .go-version
            - name: Install govulncheck
              run: go install golang.org/x/vuln/cmd/govulncheck@latest
            - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
              with:
                  go-version-file: .go-version
            - name: Install yass
              run: |
                  set -euo pipefail
                  curl -fsSL https://raw.githubusercontent.com/shakefu/yass/main/install.sh \
                      | sh -s -- --version v0.11.0
                  yass --version
            - name: Run tests
              run: ./script/cibuild
